<div class="detail-log-status">
  <div class="dialog-header">
    <h1 mat-dialog-title>Details - Log Status {{ data.sessionId }}</h1>
    <button mat-icon-button [mat-dialog-close]="false">
      <mat-icon>X</mat-icon>
    </button>
  </div>

  <div mat-dialog-content>
    <div class="export-file">
      <button class="btn btn-submit" (click)="exportFile()">Export File</button>
    </div>
    <div>
      <table class="table">
        <thead>
          <tr>
            <th>Id</th>
            <th>Ticket | Ticket Type | Settlement Action</th>
            <th>StatusId</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of data.logs">
            <td class="text-center">{{ item.id }}</td>
            <td class="text-center bold">
              {{ item.ticketCount }} |
              <span class="text-blue">{{ item.ticketTypeExplicit }}</span> |
              <span class="text-orange"> {{ item.settlementAction }}</span>
            </td>
            <td class="text-center">{{ item.statusId }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div mat-dialog-actions></div>
</div>
