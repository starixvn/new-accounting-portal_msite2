<div class="head-page">
  <h1 class="title-page">On/Off Sync Service</h1>
  <div class="refresh" alt="refresh" (click)="loadData()"></div>
</div>

<table class="table">
  <thead>
    <tr>
      <th>DB Server</th>
      <th>Last LogId</th>
      <th>Last Log Status</th>
      <th>Waiting Tasks</th>
      <th>Action</th>
    </tr>
  </thead>

  <tbody>
    <ng-container>
      <tr>
        <td>SiteDB</td>
        <td></td>
        <td></td>
        <td></td>
        <td class="action">
          <mat-slide-toggle
            color="primary"
            [checked]="currentStatus"
            (change)="openConfirmDialog($event)"
          >
          </mat-slide-toggle>
        </td>
      </tr>
    </ng-container>
    <ng-template #noData>
      <tr>
        <td colspan="7" class="no-data">No Information Available</td>
      </tr>
    </ng-template>
  </tbody>
</table>
