<h1>Update System Settings</h1>

<table *ngIf="systemSettings">
  <thead>
    <tr>
      <th>DB Server</th>
      <th>VID</th>
      <th>Vname</th>
      <th>Vvalue</th>
      <th>Action</th>
    </tr>
  </thead>

  <tbody>
    <ng-container *ngIf="systemSettings.length; else noData">
      <tr *ngFor="let item of systemSettings">
        <td>{{ item.dbServer }}</td>
        <td>{{ item.vId }}</td>
        <td>{{ item.vValue }}</td>
        <td>{{ item.vName }}</td>
        <td>
          <div class="action">
            <button (click)="openUpdateConfirmDialog(item)">Update</button>
          </div>
        </td>
      </tr>
    </ng-container>

    <ng-template #noData>
      <tr>
        <td colspan="5"></td>
      </tr>
    </ng-template>
  </tbody>
</table>
