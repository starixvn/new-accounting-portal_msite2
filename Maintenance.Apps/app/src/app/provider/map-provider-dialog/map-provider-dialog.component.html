<div class="map-provider-dialog-content">
    <h2 class="title-dialog">Map Provider</h2>
    <form [formGroup]="mapProviderForm" class="form-container" (ngSubmit)="onSubmit()">
        <div class="form-group">
            <label for="sport">Sport </label>
            <input type="text" disabled [value]="data.sport.name" />
        </div>
        <div class="form-group">
            <label for="provider">Provider</label>
            <select formControlName="provider" class="select">
                <option *ngFor="let provider of data.providers" [value]="provider.sourceId">
                    {{ provider.sourceName }}
                </option>
            </select>
        </div>
        <div class="btn-group">
            <button type="submit" class="btn" [ngClass]="mapProviderForm.valid ? 'btn-submit' : 'btn-disable'"
                [disabled]="!mapProviderForm.valid">Submit</button>
            <button type="button" class="btn-cancel" (click)="onCancel()">Cancel</button>
        </div>
    </form>
</div>
