<div class="head-page">
    <h1 class="title-page">Mapping Provider to Sport</h1>
</div>

<div class="filter">
    <form [formGroup]="filterForm" class="filter-form" (ngSubmit)="submit()">
        <label for="provider">Sport</label>
        <select formControlName="sportId" class="select" placeholder="Select an option">
            <option *ngFor="let sport of sportOptions" [value]="sport.id">
                {{ sport.name }}
            </option>
        </select>

        <button type="submit" class="btn-submit">Submit</button>
    </form>

    <button type="submit" (click)="mapProvider()">Map Provider</button>
</div>

<div class="table-container" *ngIf="providers && providers.length > 0">
    <table class="table">
        <thead>
            <tr>
                <th>SourceId</th>
                <th>SourceName</th>
                <th>Remark</th>
                <th>IsActive</th>
            </tr>
        </thead>
        <tbody>
            <!-- Data rows when not loading and providers exist -->
            <ng-container *ngIf="providers && providers.length > 0">
                <tr *ngFor="let provider of providers">
                    <td>{{ provider.sourceId }}</td>
                    <td>{{ provider.sourceName }}</td>
                    <td>{{ provider.remark }}</td>
                    <td>{{ provider.isActive }}</td>
                </tr>
            </ng-container>

            <tr *ngIf="providers.length === 0">
                <td colspan="4" class="no-data-cell">
                    <div class="no-data-content">
                        <p>No providers found for the selected sport.</p>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
</div>
