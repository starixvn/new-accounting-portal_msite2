<div class="app-select">
    <label *ngIf="label" class="app-select__label">
        {{ label }}
    </label>

    <select class="app-select__input" [disabled]="disabled" (change)="onSelectionChange($event)">
        <option value="" disabled selected>{{ placeholder }}</option>
        <option *ngFor="let option of options" [value]="option.value" [selected]="option.value == value">
            {{ option.label }}
        </option>
    </select>
</div>
