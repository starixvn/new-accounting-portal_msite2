<div class="dialog-header">
  <h2 mat-dialog-title [innerHtml]="title"></h2>
  <button mat-icon-button [mat-dialog-close]="false" tabindex="-1">
    <mat-icon>X</mat-icon>
  </button>
</div>

<div mat-dialog-content [innerHtml]="message"></div>

<div mat-dialog-actions>
  <button class="btn" [ngClass]="confirmStyle" (click)="onOk()">
    {{ confirmText }}
  </button>
  <button class="btn" [ngClass]="cancelStyle" (click)="onCancel()">
    {{ cancelText }}
  </button>
</div>
