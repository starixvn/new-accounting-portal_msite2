<div class="dialog-header">
  <h2 mat-dialog-title>Warning</h2>
  <button mat-icon-button [matDialogClose]="false" tabindex="-1">
    <mat-icon>X</mat-icon>
  </button>
</div>

<div mat-dialog-content [innerHtml]="message"></div>

<div mat-dialog-actions>
  <button class="btn btn-delete" (click)="onOk()">Ok</button>
</div>
