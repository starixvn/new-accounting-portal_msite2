<header>
  <div class="logo">
    <a href="../">mSite2</a>
  </div>
  <nav *ngIf="menus">
    <ul class="menu">
      <li class="has-kids" *ngFor="let menu of menus">
        <a href="javascript:;">{{ menu.name }}</a>
        <ul class="parent-menu">
          <li *ngFor="let subMenu of menu.subMenu" class="parent-menu-item">
            <div
              *ngIf="
                subMenu.name !== 'Manage Void Services';
                then thenBlock;
                else elseBlock
              "
            ></div>
            <ng-template #thenBlock>
              <a
                class="item__link"
                [routerLink]="[getUrl(subMenu.validUrl)]"
                [routerLinkActive]="['active-link']"
                >{{ subMenu.name }}</a
              >
            </ng-template>
            <ng-template #elseBlock>
              <a href="{{ subMenu.validUrl }}" target="_blank">{{
                subMenu.name
              }}</a>
            </ng-template>
            <ul
              class="child-menu"
              *ngIf="subMenu.subMenu && subMenu.subMenu.length"
            >
              <li *ngFor="let item of subMenu.subMenu" class="child-menu-item">
                <a
                  class="child-item__link"
                  [routerLink]="[getUrl(item.validUrl)]"
                  [routerLinkActive]="['active-link']"
                  >{{ item.name }}</a
                >
              </li>
            </ul>
          </li>
        </ul>
      </li>
    </ul>
  </nav>
  <div class="user-info">
    <div class="greeting">
      <h2>Welcome, {{ userName }}</h2>
      <ul class="log-out">
        <li><a href="/Auth/LogOut" title="Sign Out">Sign Out</a></li>
      </ul>
    </div>
  </div>
</header>
