<header>
  <div class="logo">
    <a href="../">mSite2</a>
  </div>
  <nav *ngIf="menus">
    <ul class="menu">
      <li class="has-kids" *ngFor="let menu of menus">
        <a *ngIf="menu.parentId; else noParent" href="javascript:;">{{
          menu.name
        }}</a>
        <ng-template #noParent>
          <a [routerLink]="[menu.validUrl]">{{ menu.name }}</a></ng-template
        >
        <ul>
          <li *ngFor="let subMenu of menu.subMenu">
            <a
              [routerLink]="[subMenu.validUrl]"
              [routerLinkActive]="['active-link']"
              >{{ subMenu.name }}</a
            >
          </li>
        </ul>
      </li>
    </ul>
  </nav>
  <div class="user-info">
    <div class="greeting">
      <h2>Welcome, {{ userName }}</h2>
      <ul>
        <li><a href="/Auth/LogOut" title="Sign Out">Sign Out</a></li>
      </ul>
    </div>
  </div>
</header>
