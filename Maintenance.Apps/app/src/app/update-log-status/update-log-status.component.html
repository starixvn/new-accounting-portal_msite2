<h1 class="title-page">Update Log Status</h1>

<table class="table">
  <thead class="table-head">
    <tr>
      <th>DB Server</th>
      <th>LogID</th>
      <th>StatusID</th>
      <th>Real Data</th>
      <th>StartTime</th>
      <th>EndTime</th>
      <th>StartTimeValidation</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody>
    <ng-container *ngIf="logs && logs.length; else noData">
      <tr *ngFor="let log of logs">
        <td>{{ log.serverName }}</td>
        <td>
          <span (click)="openDetailLogStatusDialog(log)" class="btn-detail">{{
            log.logId
          }}</span>
        </td>
        <td class="orange">{{ log.statusId }}</td>
        <td><input type="checkbox" [value]="!!log.transInfo" disabled /></td>
        <td>{{ log.startTime }}</td>
        <td>{{ log.endTime }}</td>
        <td>{{ log.startTimeValidation }}</td>
        <td>
          <div class="action">
            <button class="btn-submit" (click)="openUpdateConfirmDialog(log)">
              Update
            </button>
            <button class="btn-delete" (click)="openDeleteConfirmDialog(log)">
              Delete
            </button>
          </div>
        </td>
      </tr>
    </ng-container>

    <ng-template #noData>
      <tr>
        <td colspan="7" class="no-data">No Information Available</td>
      </tr>
    </ng-template>
  </tbody>
</table>
