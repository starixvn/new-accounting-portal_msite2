<h1>Update Log Status</h1>

<table>
  <thead class="table-head">
    <tr>
      <th>DB Server</th>
      <th>LogID</th>
      <th>StatusID</th>
      <th>StartTime</th>
      <th>EndTime</th>
      <th>StartTimeValidation</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody>
    <ng-container *ngIf="logs && logs.length; else noData">
      <tr *ngFor="let log of logs">
        <td>{{ log.dbServer }}</td>
        <td>
          <a
            [routerLink]="['/update-log', log.logID]"
            routerLinkActive="router-link-active"
            >{{ log.logID }}</a
          >
        </td>
        <td>{{ log.statusID }}</td>

        <td>{{ log.startTime }}</td>
        <td>{{ log.endTime }}</td>
        <td>{{ log.startTimeValidation }}</td>
        <td>
          <div class="action">
            <button class="btn-update" (click)="openDialog()">Update</button>
            <button class="btn-delete">Delete</button>
          </div>
        </td>
      </tr>
    </ng-container>

    <ng-template #noData>
      <tr>
        <td colspan="7" class="no-data">No Information Available</td>
      </tr>
    </ng-template>
  </tbody>
</table>
