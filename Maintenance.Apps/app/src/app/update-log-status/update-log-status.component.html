<div class="head-page">
  <h1 class="title-page">Update Log Status</h1>
  <div class="refresh" alt="refresh" (click)="loadData()"></div>
</div>
<table class="table">
  <thead class="table-head">
    <tr>
      <th>DB Server</th>
      <th>LogID</th>
      <th>StartTime</th>
      <th class="action">Action</th>
    </tr>
  </thead>
  <tbody>
    <ng-container *ngIf="logsProcessed && logsProcessed.length; else noData">
      <ng-container *ngFor="let item of logsProcessed">
        <tr *ngFor="let log of item; first as isFirst">
          <td>{{ log.serverName }}</td>
          <td>
            <span (click)="openDetailLogStatusDialog(log)" class="btn-detail">{{
              log.logId
            }}</span>
          </td>
          <td>
            {{ log.startTime | date : "mediumDate" }}
            {{ log.startTime | date : "hh:mm:ss a" }}
          </td>
          <td *ngIf="isFirst" [attr.rowspan]="item.length">
            <div class="action-button">
              <button class="btn-submit" (click)="handleUpdateLogStatus(item)">
                Update
              </button>
              <!-- <button class="btn-delete" (click)="openDeleteConfirmDialog(log)">
                    Delete
                  </button> -->
            </div>
          </td>
        </tr>
      </ng-container>
    </ng-container>
    <ng-template #noData>
      <tr>
        <td colspan="8" class="no-data">No Information Available</td>
      </tr>
    </ng-template>
  </tbody>
</table>
